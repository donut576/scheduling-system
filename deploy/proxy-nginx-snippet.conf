# 加進「總機」Nginx 的設定。憑證路徑請依總機實際位置調整；
# 如果總機已有統一的憑證設定（例如萬用字元憑證），沿用即可。
server {
    listen 80;
    server_name shift-schedule.ecolab-taiwan.com.tw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name shift-schedule.ecolab-taiwan.com.tw;

    ssl_certificate     /path/to/fullchain.pem;    # 請改成實際的憑證檔
    ssl_certificate_key /path/to/privkey.pem;      # 請改成實際的私鑰檔

    location / {
        proxy_pass http://scheduling-frontend:80;   # 與總機同在 proxy-network
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}