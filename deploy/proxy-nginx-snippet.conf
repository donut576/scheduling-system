# 加進「總機」Nginx 的設定。網域是範例，請依實際決定（例如 shift-schedule.ecolab-taiwan.com.tw）
server {
    listen 80;                                   # 有 HTTPS 的話改成 443 ssl 並放憑證
    server_name shift-schedule.ecolab-taiwan.com.tw;

    location / {
        proxy_pass http://scheduling-frontend:80;   # 總機與 scheduling-frontend 在同一個 proxy-network
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
