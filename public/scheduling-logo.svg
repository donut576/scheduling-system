<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景漸層（專業深邃科技藍） -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077D4" />
      <stop offset="50%" stop-color="#005EB8" />
      <stop offset="100%" stop-color="#003D7A" />
    </linearGradient>
    
    <!-- 幾何反光漸層 -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 智慧派遣/合規完成綠色漸層 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- 圓角外框主體 -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" />
  <!-- 頂部微反光 -->
  <rect x="32" y="32" width="448" height="224" rx="104" fill="url(#shineGrad)" />

  <!-- 日曆頂部吊環 -->
  <rect x="144" y="88" width="28" height="56" rx="14" fill="#FFFFFF" opacity="0.95" />
  <rect x="340" y="88" width="28" height="56" rx="14" fill="#FFFFFF" opacity="0.95" />

  <!-- 日曆看板白底 -->
  <rect x="96" y="124" width="320" height="288" rx="36" fill="#FFFFFF" />

  <!-- 日曆 Header 橫條 (品牌藍) -->
  <path d="M 96 160 C 96 140 112 124 132 124 L 380 124 C 400 124 416 140 416 160 L 416 196 L 96 196 Z" fill="#005EB8" />

  <!-- 日曆排程網格點 -->
  <circle cx="160" cy="244" r="15" fill="#E2E8F0" />
  <circle cx="220" cy="244" r="15" fill="#E2E8F0" />
  <circle cx="280" cy="244" r="15" fill="#E2E8F0" />
  <circle cx="340" cy="244" r="15" fill="#0077D4" />

  <circle cx="160" cy="300" r="15" fill="#E2E8F0" />
  <circle cx="220" cy="300" r="15" fill="#0077D4" />
  <circle cx="280" cy="300" r="15" fill="#E2E8F0" />
  <circle cx="340" cy="300" r="15" fill="#E2E8F0" />

  <!-- 時鐘/時間軸指針意象 -->
  <circle cx="190" cy="356" r="30" fill="none" stroke="#005EB8" stroke-width="7" opacity="0.85" />
  <path d="M 190 338 L 190 356 L 204 356" fill="none" stroke="#005EB8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 右下角智慧派遣/合規核准打勾徽章 -->
  <circle cx="350" cy="350" r="60" fill="url(#accentGrad)" />
  <circle cx="350" cy="350" r="54" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4" />
  <path d="M 330 350 L 344 364 L 374 334" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
</svg>\n